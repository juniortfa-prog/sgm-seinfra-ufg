name: Verificação preventiva do repositório
on:
  push:
  pull_request:
jobs:
  sem-bases-operacionais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar arquivos publicados
        run: python scripts/verificar_repositorio.py
      - name: Testar contrato de dados sem registros reais
        run: node --test tests/test_data_adapter.mjs
